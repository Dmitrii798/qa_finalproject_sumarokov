allure-report:
  needs: [ api-tests, ui-tests ]
  if: always()
  runs-on: ubuntu-latest
  permissions:
    contents: write
    pages: write
    id-token: write
  steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        path: allure-results
        merge-multiple: true    #склеить все артефакты в одну папку
    - name: Install Allure CLI
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jre-headless wget unzip
        wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.zip
        unzip allure-2.30.0.zip
        sudo mv allure-2.30.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
    - name: Generate Allure Report
      run: |
        echo "=== allure-results contents ==="
        ls -la allure-results/ | head -20
        echo "=== files count ==="
        find allure-results/ -name "*-result.json" | wc -l
        allure generate allure-results -o allure-history --clean
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-history
        force_orphan: true   # перезаписать gh-pages с нуля
          